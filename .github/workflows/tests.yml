name: Validator bot tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check installer and run offline tests
        env:
          GENESISL1_BOT_CONFIG: /dev/null
          PREFER_IPV4: "0"
        run: |
          bash -n install.sh
          python3 -B -m unittest discover -v -p 'test_*.py'
